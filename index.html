<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>গ্রুপ তহবিল</title>
<style>
:root{--p:#0f766e;--bg:#f1f5f4;--c:#fff;--t:#1f2937;--m:#6b7280;--g:#15803d;--r:#b91c1c;--b:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f1716;--c:#17211f;--t:#e5e7eb;--m:#9ca3af;--b:#2a3836;--g:#4ade80;--r:#f87171}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--t);padding-bottom:70px}
header{background:var(--p);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:17px}header button{background:#ffffff33;color:#fff;border:0;border-radius:8px;padding:6px 12px}
main{max-width:760px;margin:auto;padding:12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
.k{color:var(--m);font-size:12px}.v{font-size:22px;font-weight:700}.pos{color:var(--g)}.neg{color:var(--r)}
h3{margin:0 0 8px;font-size:15px}
input,select,button,textarea{font:inherit;padding:9px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);width:100%;margin:3px 0}
button.pri{background:var(--p);color:#fff;border:0;font-weight:600}button.sm{width:auto;padding:3px 9px;font-size:12px}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--b);text-align:left;white-space:nowrap}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);border-top:1px solid var(--b);display:flex;overflow-x:auto;z-index:5}
nav button{flex:1;min-width:76px;border:0;border-radius:0;margin:0;background:none;font-size:12px;padding:10px 4px}nav button.on{color:var(--p);font-weight:700;border-top:3px solid var(--p)}
body{overscroll-behavior-y:contain;-webkit-tap-highlight-color:transparent}button:active{opacity:.7}.off{background:#b45309;color:#fff;text-align:center;font-size:12px;padding:4px}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#111d;color:#fff;padding:8px 18px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:9;font-size:14px}.tg{font-size:11px;padding:0 6px;border-radius:8px;background:var(--b)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lb{display:block;font-size:12px;color:var(--m);margin:10px 0 0}.row{display:flex;gap:8px}.row select{flex:1}button.dng{background:#b91c1c;color:#fff;border:0}.login{max-width:340px;margin:12vh auto;text-align:center}.msg{color:var(--r);font-size:13px}.tag{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--b)}
</style></head><body><div id="app"></div><input type="file" id="fi" hidden><div id="toast"></div>
<script type="module">
import{initializeApp,deleteApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword,updatePassword,reauthenticateWithCredential,EmailAuthProvider}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{initializeFirestore,persistentLocalCache,collection,doc,getDoc,setDoc,deleteDoc,onSnapshot,query,where,writeBatch}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ====== ধাপ ১: নিচের cfg-তে আপনার Firebase কনফিগ বসান (README দেখুন) ======
const cfg={apiKey:"AIzaSyDm9EhPGyPtMglKbkqwi7PRae86X3tGJgA",authDomain:"fundapp-4f293.firebaseapp.com",projectId:"fundapp-4f293",appId:"1:691203822442:web:dc57e69671219bb0854b13"};
const ADMIN="mamun@fund.app";
const app=initializeApp(cfg),auth=getAuth(app),db=initializeFirestore(app,{localCache:persistentLocalCache()});
const MN=["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
const $=s=>document.querySelector(s),f=n=>Number(n||0).toLocaleString("bn-BD"),sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);
const nowYM=new Date().toISOString().slice(0,7),today=new Date().toISOString().slice(0,10);
const lab=y=>MN[+y.slice(5)-1]+" "+(+y.slice(0,4)).toLocaleString("bn-BD",{useGrouping:false});
const nx=y=>{let[a,b]=y.split("-").map(Number);b++;if(b>12){b=1;a++}return a+"-"+String(b).padStart(2,"0")};
const S={user:null,admin:false,members:[],tx:[],common:[],sum:null,tab:"home",err:"",ready:false,fl:{m:"",y:nowYM.slice(0,4),mo:"",t:"",q:""}};

const rateAt=(m,y)=>{let r=m.rate0;[...(m.changes||[])].sort((a,b)=>a.from<b.from?-1:1).forEach(c=>{if(c.from<=y)r=c.rate});return r};
function ledger(m){
  const pays=S.tx.filter(t=>t.kind=="pay"&&t.memberId==m.id),wv=S.tx.filter(t=>t.kind=="waiver"&&t.memberId==m.id),gw=new Set(S.common.filter(c=>c.kind=="gwaiver").map(c=>c.ym));
  let last=nowYM;pays.forEach(p=>{if(p.ym>last)last=p.ym});
  let bal=sum(pays.filter(p=>p.ym<m.join),"amount");const rows=[];
  for(let y=m.join;y<=last;y=nx(y)){
    const w=sum(wv.filter(x=>x.ym==y),"amount"),due=gw.has(y)?0:Math.max(0,rateAt(m,y)-w),paid=sum(pays.filter(p=>p.ym==y),"amount");
    bal+=paid-due;rows.push({ym:y,due,paid,bal})}
  return{rows,bal}}

// ---------- online data (Firebase) ----------
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),clean=s=>(s||"").trim().toLowerCase().replace(/[^a-z0-9_.-]/g,""),email=i=>i+"@fund.app";
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1800)};
const put=(c,o)=>{setDoc(doc(db,c,o.id),o).catch(e=>alert("সংরক্ষণ হয়নি: "+e.message));toast("✓ সংরক্ষিত")};
const rm=(c,id)=>{deleteDoc(doc(db,c,id)).catch(e=>alert(e.message));toast("মোছা হয়েছে")};
let unsub=[];const clear=()=>{unsub.forEach(u=>u());unsub=[]};
const watch=(q_,key)=>unsub.push(onSnapshot(q_,s=>{S[key]=s.docs.map(d=>({id:d.id,...d.data()}));if(key=="members")S.ready=true;render()},e=>{S.err=e.message;render()}));
const startAuth=()=>onAuthStateChanged(auth,async u=>{
  clear();S.user=u;S.err="";S.ready=false;S.members=[];S.tx=[];S.common=[];S.sum=null;S.tab="home";S.fl={m:"",y:nowYM.slice(0,4),mo:"",t:"",q:""};if(!u){render();return}
  S.admin=u.email==ADMIN;
  if(S.admin){watch(collection(db,"members"),"members");watch(collection(db,"tx"),"tx");watch(collection(db,"common"),"common")}
  else{try{const ud=await getDoc(doc(db,"users",u.uid));if(!ud.exists()){S.err="এই আইডি কোনো সদস্যের সাথে যুক্ত নয়";S.ready=true;render();return}
    const mid=ud.data().memberId;
    unsub.push(onSnapshot(doc(db,"members",mid),d=>{S.members=[{id:d.id,...d.data()}];S.ready=true;render()},e=>{S.err=e.message;render()}));
    watch(query(collection(db,"tx"),where("memberId","==",mid)),"tx");watch(collection(db,"common"),"common");
    unsub.push(onSnapshot(doc(db,"summary","group"),d=>{S.sum=d.data();render()}))}catch(e){S.err="লোড হয়নি — ইন্টারনেট চেক করুন";S.ready=true;render()}}
  render()});
function summary(){
  const pays=S.tx.filter(t=>t.kind=="pay"),pay=sum(pays,"amount"),ex=sum(S.common.filter(c=>c.kind=="extra"),"amount"),out=sum(S.common.filter(c=>c.kind=="expense"),"amount");
  return{balance:pay+ex-out,totalIn:pay+ex,totalOut:out,monthly:pay,extra:ex,members:S.members.length,thisMonth:sum(pays.filter(p=>p.ym==nowYM),"amount"),due:S.members.reduce((a,m)=>a+Math.max(0,-ledger(m).bal),0)}}
let lastSum="";setInterval(()=>{if(!S.admin||!S.ready||!S.members.length)return;const o=summary(),s=JSON.stringify(o);if(s!=lastSum){lastSum=s;setDoc(doc(db,"summary","group"),{...o,updated:Date.now()}).catch(()=>{})}},3000);
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
async function mkLogin(m,id,pw){const sec=initializeApp(cfg,"sec"+Date.now()),sa=getAuth(sec);
  try{const c=await createUserWithEmailAndPassword(sa,email(id),pw);if(m.uid)deleteDoc(doc(db,"users",m.uid));
    await setDoc(doc(db,"users",c.user.uid),{memberId:m.id,loginId:id});await setDoc(doc(db,"members",m.id),{...m,loginId:id,uid:c.user.uid});await signOut(sa)}finally{deleteApp(sec)}}
async function importData(d){const it=[];(d.members||[]).forEach(m=>{const o={...m};delete o.pw;delete o.loginId;delete o.uid;it.push(["members",o])});(d.tx||[]).forEach(x=>it.push(["tx",x]));(d.common||[]).forEach(x=>it.push(["common",x]));
  for(let i=0;i<it.length;i+=400){const b=writeBatch(db);it.slice(i,i+400).forEach(([c,o])=>b.set(doc(db,c,o.id),o));await b.commit()}toast("ইমপোর্ট সম্পন্ন ("+it.length+" টি)")}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();S.inst=e;render()});window.addEventListener("online",render);window.addEventListener("offline",render);
// ---------- views ----------
const nameOf=id=>(S.members.find(m=>m.id==id)||{}).name||"?";
const commonList=()=>{const l=S.common.filter(c=>c.kind!="gwaiver").sort((a,b)=>(b.date||"")>(a.date||"")?1:-1).slice(0,30);
  return`<div class="card"><h3>অতিরিক্ত তহবিল ও খরচ</h3><div class="tbl"><table>${l.map(c=>`<tr><td>${c.date||""}</td><td>${c.kind=="expense"?"খরচ":"অতিরিক্ত জমা"}</td><td>${c.title||""}</td><td class="${c.kind=="expense"?"neg":"pos"}">${f(c.amount)}</td>${S.admin?`<td><button class="sm" data-ec="${c.id}">✏️</button> <button class="sm" data-del="common/${c.id}">✕</button></td>`:""}</tr>`).join("")||"<tr><td>কিছু নেই</td></tr>"}</table></div></div>`};
const ledTable=m=>{const L=ledger(m);return`<div class="card"><h3>${m.name} — মাসওয়ারি হিসাব</h3><div class="tbl"><table><tr><th>মাস</th><th>প্রযোজ্য</th><th>জমা</th><th>ব্যালেন্স</th></tr>${[...L.rows].reverse().map(r=>`<tr><td>${lab(r.ym)}</td><td>${f(r.due)}</td><td>${f(r.paid)}</td><td class="${r.bal<0?"neg":"pos"}">${f(r.bal)}</td></tr>`).join("")}</table></div></div>`};
const q=x=>String(x??"").replace(/"/g,"&quot;"),F=(l,h)=>`<label class="lb">${l}</label>${h}`;
const SEL=(id,o,cur)=>`<select id="${id}">${o.map(x=>{const[a,b]=Array.isArray(x)?x:[x,x];return`<option value="${q(a)}"${a==cur?" selected":""}>${b}</option>`}).join("")}</select>`;
const MP=(id,val)=>{const[y,m]=(val||nowYM).split("-"),ys=[];for(let i=2020;i<=+nowYM.slice(0,4)+3;i++)ys.push(i);
  return`<div class="row"><select id="${id}m">${MN.map((n,i)=>`<option value="${String(i+1).padStart(2,"0")}"${+m==i+1?" selected":""}>${n}</option>`).join("")}</select><select id="${id}y">${ys.map(x=>`<option value="${x}"${x==y?" selected":""}>${x.toLocaleString("bn-BD",{useGrouping:false})}</option>`).join("")}</select></div>`};
const mv=id=>v(id+"y")+"-"+v(id+"m");
const grp=o=>[["তহবিল ব্যালেন্স",o.balance,""],["মোট জমা (সর্বমোট)",o.totalIn,"pos"],["মোট মাসিক চাঁদা (সর্বমোট)",o.monthly,""],["মোট অতিরিক্ত তহবিল (সর্বমোট)",o.extra,""],["মোট খরচ (সর্বমোট)",o.totalOut,"neg"],["এই মাসের মোট জমা",o.thisMonth,""],["মোট বকেয়া (সব সদস্য)",o.due,"neg"]].map(([k,x,c])=>`<div class="card"><div class="k">${k}</div><div class="v ${c}">৳${f(x)}</div></div>`).join("")+`<div class="card"><div class="k">সদস্য সংখ্যা</div><div class="v">${f(o.members)}</div></div>`;

const TYPES=[["","সব ধরন"],["pay","মাসিক জমা"],["adv","অগ্রিম জমা"],["due","প্রযোজ্য (ডেবিট)"],["waiver","মওকুফ"],["extra","অতিরিক্ত তহবিল"],["expense","খরচ"]];
function rows(){const R=[];
  S.tx.forEach(x=>{if(x.kind=="pay"){const adv=x.ym>(x.date||x.ym).slice(0,7);R.push({id:x.id,col:"tx",k:adv?"adv":"pay",date:x.date||x.ym+"-01",ym:x.ym,who:x.memberId,cr:x.amount,dr:0,txt:(adv?"অগ্রিম জমা — ":"মাসিক চাঁদা — ")+lab(x.ym)+(x.method?" ("+x.method+")":""),note:x.note||""})}
    else if(x.kind=="waiver")R.push({id:x.id,col:"tx",k:"waiver",date:x.ym+"-01",ym:x.ym,who:x.memberId,cr:0,dr:0,wv:x.amount,txt:"মওকুফ — "+lab(x.ym),note:""})});
  S.common.forEach(c=>{const d=c.date||c.ym||"";if(c.kind=="gwaiver")R.push({id:c.id,col:"common",k:"gwaiver",date:c.ym+"-01",ym:c.ym,who:null,cr:0,dr:0,txt:"[গ্রুপ] সবার চাঁদা মওকুফ — "+lab(c.ym),note:c.title||""});
    else R.push({id:c.id,col:"common",k:c.kind,date:d,ym:d.slice(0,7),who:null,cr:c.kind=="extra"?c.amount:0,dr:c.kind=="expense"?c.amount:0,txt:"[গ্রুপ] "+(c.title||(c.kind=="extra"?"অতিরিক্ত জমা":"খরচ")),note:""})});
  S.members.forEach(m=>ledger(m).rows.forEach(r=>{if(r.due>0)R.push({k:"due",date:r.ym+"-01",ym:r.ym,who:m.id,cr:0,dr:r.due,txt:"মাসিক চাঁদা প্রযোজ্য — "+lab(r.ym),note:""})}));
  return R}
const flt=(R,F)=>R.filter(r=>(!F.m||!S.admin||r.who==F.m)&&(!F.y||(r.ym||"").slice(0,4)==F.y)&&(!F.mo||(r.ym||"").slice(5)==F.mo)&&(!F.t||r.k==F.t||(F.t=="waiver"&&r.k=="gwaiver"))&&(!F.q||(r.txt+" "+r.note).includes(F.q))).sort((a,b)=>a.date<b.date?1:-1);
function filterUI(admin){const ys=new Set([nowYM.slice(0,4)]);rows().forEach(r=>r.ym&&ys.add(r.ym.slice(0,4)));
  const FS=(k,l,o)=>F(l,`<select data-f="${k}">${o.map(([a,b])=>`<option value="${q(a)}"${a==S.fl[k]?" selected":""}>${b}</option>`).join("")}</select>`);
  return`<div class="card"><h3>🔎 ফিল্টার</h3>${admin?FS("m","সদস্য",[["","সব সদস্য"],...S.members.map(m=>[m.id,m.name])]):""}<div class="g2">${FS("y","বছর",[["","সব বছর"],...[...ys].sort().reverse().map(y=>[y,(+y).toLocaleString("bn-BD",{useGrouping:false})])])}${FS("mo","মাস",[["","সব মাস"],...MN.map((n,i)=>[String(i+1).padStart(2,"0"),n])])}</div>
  ${FS("t","ধরন",TYPES)}${F("কারণ/বিবরণ দিয়ে খুঁজুন",`<input data-f="q" placeholder="যেমন: ইফতার" value="${q(S.fl.q)}">`)}<button class="sm" data-act="freset" style="margin-top:8px">ফিল্টার মুছুন</button></div>`}
function stmt(admin){const R=flt(rows(),S.fl),pays=sum(R.filter(r=>r.k=="pay"||r.k=="adv"),"cr"),due=sum(R.filter(r=>r.k=="due"),"dr"),wv=sum(R,"wv"),ex=sum(R.filter(r=>r.k=="extra"),"cr"),out=sum(R.filter(r=>r.k=="expense"),"dr");
  const box=[["জমা",pays,"pos"],["প্রযোজ্য (ডেবিট)",due,""],["মওকুফ",wv,""],["অতিরিক্ত তহবিল",ex,"pos"],["খরচ",out,"neg"]].filter(x=>x[1]).map(([k,x,c])=>`<div class="card"><div class="k">${k}</div><div class="v ${c}">৳${f(x)}</div></div>`).join("");
  const ed={pay:"ep",adv:"ep",extra:"ec",expense:"ec",waiver:"ew",gwaiver:"eg"};
  return filterUI(admin)+`<div class="grid" style="margin-top:12px">${box||'<div class="card"><div class="k">এই ফিল্টারে কোনো টাকা নেই</div></div>'}</div><div class="card" style="margin-top:12px"><h3>${f(R.length)} টি এন্ট্রি</h3><div class="tbl"><table><tr><th>তারিখ</th>${admin?"<th>সদস্য</th>":""}<th>বিবরণ</th><th>ক্রেডিট</th><th>ডেবিট</th>${admin?"<th></th>":""}</tr>
  ${R.slice(0,200).map(r=>`<tr><td>${r.k=="due"||r.k=="waiver"||r.k=="gwaiver"?lab(r.ym):r.date}</td>${admin?`<td>${r.who?nameOf(r.who):"গ্রুপ"}</td>`:""}<td>${r.txt}${r.k=="adv"?' <span class="tg">অগ্রিম</span>':""}${r.note?`<br><span class="k">${r.note}</span>`:""}</td><td class="pos">${r.cr?f(r.cr):r.wv?"মওকুফ "+f(r.wv):""}</td><td class="neg">${r.dr?f(r.dr):""}</td>${admin?`<td>${ed[r.k]?`<button class="sm" data-${ed[r.k]}="${r.id}">✏️</button> <button class="sm" data-del="${r.col}/${r.id}">✕</button>`:""}</td>`:""}</tr>`).join("")||"<tr><td>কিছু পাওয়া যায়নি</td></tr>"}</table></div>${R.length>200?'<p class="k">প্রথম ২০০টি দেখানো হচ্ছে — ফিল্টার ব্যবহার করুন</p>':""}</div>`}
function memberView(){
  const m=S.members[0];if(!m)return"<p>লোড হচ্ছে…</p>";const L=ledger(m),g=S.sum||{},cur=L.rows.find(r=>r.ym==nowYM)||{due:0,paid:0};

    else if(d.view){S.viewM=d.view;render()}

    else if(d.login){const m=S.members.find(x=>x.id==d.login),i=clean(prompt("লগইন আইডি (ইংরেজি/সংখ্যা)")||""),p=i&&prompt("পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)");
      if(i&&p&&p.length>=6){if(S.members.some(x=>x.loginId==i&&x.id!=m.id))return alert("এই আইডি আগে নেওয়া");await mkLogin(m,i,p);toast("লগইন তৈরি: "+i)}else if(i)alert("পাসওয়ার্ড কমপক্ষে ৬ অক্ষর")}
  }catch(err){alert(err.message)}});
document.addEventListener("change",async e=>{const t=e.target;
  if(t.dataset&&t.dataset.f){S.fl[t.dataset.f]=t.value;render();return}
  if(t.id=="fi"&&t.files[0]){try{const d=JSON.parse(await t.files[0].text());t.value="";if(!d.members||!confirm("এই ফাইলের ডেটা অনলাইনে লোড হবে। নিশ্চিত?"))return;await importData(d)}catch(x){alert("ফাইলটি সঠিক নয়: "+x.message)}}});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&!S.user)A.login()});
if("serviceWorker"in navigator){navigator.serviceWorker.register("sw.js");let r;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(r)return;r=1;if(sessionStorage.sw)location.reload();sessionStorage.sw=1})}
render();startAuth();
